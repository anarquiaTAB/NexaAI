name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Aceitar licenças Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee"  > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "601085b94cd77f0b54ff86406957099ebe79c4d"  >  "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "33b6937e-be86-422e-af14-dac5a0a5f0db"    >  "$ANDROID_HOME/licenses/android-googletv-license"

      - name: Instalar NDK e CMake
        run: sdkmanager "ndk;25.1.8937393" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexaAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
